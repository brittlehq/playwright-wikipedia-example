# Brittle Hub config tuned for the local docker-compose stack in this repo.
#
# Mounted into the brittle container at /etc/brittle/hub.config.yaml via the
# `volumes:` block in docker-compose.yml; the container looks for it there
# because the compose file sets BRITTLE_CONFIG_PATH to this path.
#
# All `${VAR}` placeholders interpolate from process env at hub startup.
# Secrets (JWT_SECRET, DATABASE_URL) flow in via docker-compose
# `environment:` — see docker-compose.yml for the values.

server:
  host: 0.0.0.0
  port: ${HUB_PORT:3100}
  logLevel: ${LOG_LEVEL:info}

database:
  url: ${DATABASE_URL}

auth:
  jwtSecret: ${JWT_SECRET}

artifacts:
  # `local:<absolute-path>` writes artifacts to the container's filesystem.
  # The matching docker volume `brittle-artifacts` in docker-compose.yml is
  # mounted at this path — survives `docker compose down` (data persists),
  # nuked by `docker compose down -v`.
  #
  # In local mode the hub streams artifact bytes through itself for both
  # upload and download — no separate object store, no presigned URLs.
  # Fine for a single-node deploy; switch to `s3://<bucket>` and configure
  # an `s3:` block below when you need shared storage across replicas or
  # a CDN-fronted artifact path. See README.md "Production with S3".
  store: local:/var/lib/brittle/artifacts

# Required-by-schema blocks even when their fields all default. Empty
# objects = defaults across the board.
redis: {}
session: {}
nodes:
  heartbeat: {}
internal: {}
tunnel: {}

# Optional — open a read-only demo account on the login screen. Useful for
# screenshots and public demos; leave commented for normal deployments.
# demo:
#   email: demouser@brittle.local
#   password: demouser

# AI failure analysis. Provider keys are configured per-org via the
# dashboard (Org → Settings → AI); this block is here only for the
# `enabled: true` flag. Leave disabled until you've set up a provider.
ai:
  enabled: false
